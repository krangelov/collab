  <html>
    <head>
      <script src="https://codemirror.net/codemirror.js" type="text/javascript"></script>
    </head>
    <body>
      <div id="editor"></div>
      <style>
          .cm-editor {
              width: 500px;
              height: 300px;
              border: 1px solid black
          }
      </style>
      <script>

const {receiveUpdates, sendableUpdates, collab, getSyncedVersion} = CM["@codemirror/collab"];
const {ChangeSet, EditorState, Text} = CM["@codemirror/state"];
const {basicSetup} = CM["codemirror"];
const {EditorView, ViewPlugin,} = CM["@codemirror/view"];

async function getDocument() {
    const response = 
        await fetch("http://localhost:4455", {
                        method: "POST",
                        body: JSON.stringify({type: 'getDocument'})
                    });
    return await response.json();
}

async function pushUpdates(version, fullUpdates) {
    // Strip off transaction data
    let updates = fullUpdates.map(u => ({
      clientID: u.clientID,
      changes: u.changes.toJSON()
    }));
    const response = 
        await fetch("http://localhost:4455", {
                        method: "POST",
                        body: JSON.stringify({type: 'pushUpdates', version, updates})
                    });
    return await response.json();
}

async function pullUpdates(version) {
    const response = 
        await fetch("http://localhost:4455", {
                        method: "POST",
                        body: JSON.stringify({type: 'pullUpdates', version})
                    });
    const updates = await response.json();
    return updates.map(u => ({
            changes: ChangeSet.fromJSON(u.changes),
            clientID: u.clientID
           }));
}

function peerExtension(startVersion) {
    let plugin = ViewPlugin.fromClass( (_class =class {
       __init2() {this.pushing = false;}
       __init3() {this.done = false;}

      constructor(view) {this.view = view;_class.prototype.__init2.call(this);_class.prototype.__init3.call(this); this.pull(); }

      update(update) {
        if (update.docChanged) this.push();
      }

      async push() {
        let updates = sendableUpdates(this.view.state);
        if (this.pushing || !updates.length) return
        this.pushing = true;
        let version = getSyncedVersion(this.view.state);
        let res = await pushUpdates(version, updates);
        this.pushing = false;
        // Regardless of whether the push failed or new updates came in
        // while it was running, try again if there's updates remaining
        if (sendableUpdates(this.view.state).length)
            setTimeout(() => this.push(), 100);
      }

      async pull() {
        while (!this.done) {
          let version = getSyncedVersion(this.view.state);
          let updates = await pullUpdates(version);
          this.view.dispatch(receiveUpdates(this.view.state, updates));
        }
      }

      destroy() { this.done = true; }
    }, _class));
    return [collab({startVersion}), plugin]
}

async function addPeer() {
  let {version, document: doc} = await getDocument();
  doc = Text.of(doc.split("\n"));
  let state = EditorState.create({
    doc,
    extensions: [basicSetup, peerExtension(version)]
  })
  let wrap = document.querySelector("#editor")
  let editor = new EditorView({state, parent: wrap, contentHeight: 200})
}

addPeer()
      </script>
    </body>
  </html>
